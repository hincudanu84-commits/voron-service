<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autentificare - VORON SERVICE</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head>
<body class="loginbody"><form class="loginbox" method="post"><div class="brand"><span>V</span> VORON <small>SERVICE</small></div><h2>Autentificare</h2><label>Utilizator</label><input name="username" value="admin" required><label>Parolă</label><input name="password" type="password" placeholder="Introdu parola" required><button>Intră în sistem</button><p class="hint">Prima autentificare: admin / admin123</p>{% with messages=get_flashed_messages() %}{% for m in messages %}<p class="error">{{m}}</p>{% endfor %}{% endwith %}</form></body></html>
