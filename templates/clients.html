{% extends "base.html" %}{% block content %}<h1>Clienți</h1><div class="grid"><form class="panel form" method="post"><h2>Adaugă client</h2><label>Nume și prenume *</label><input name="name" required><label>Telefon</label><input name="phone" placeholder="07..."><label>Note</label><textarea name="notes"></textarea><button>Salvează clientul</button></form>
<div class="panel"><h2>Lista clienților</h2>{% if rows %}<div class="tablewrap"><table><tr><th>Nume</th><th>Telefon</th><th>Note</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.phone}}</td><td>{{r.notes}}</td></tr>{% endfor %}</table></div>{% else %}<p class="muted">Adaugă primul client.</p>{% endif %}</div></div>{% endblock %}
